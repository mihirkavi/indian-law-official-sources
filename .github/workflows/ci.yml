name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install pypdf==6.20.0 mcp==2.3.0 python-docx==1.2.0
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Validate package and extracted archives
        run: |
          python scripts/validate_package.py plugins/indian-law
          python scripts/build_release.py
